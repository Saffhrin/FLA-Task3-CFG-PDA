<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 470" role="img" aria-label="Single-state deterministic PDA that pushes opening parentheses and pops matching closers">
<defs><marker id="arrow" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 z" fill="#344054"/></marker></defs>
<rect width="100%" height="100%" rx="16" fill="#fff"/>
<style>text{font-family:system-ui,Segoe UI,sans-serif;fill:#172b4d}.edge{stroke:#344054;stroke-width:2;fill:none;marker-end:url(#arrow)}.state{fill:#fff;stroke:#344054;stroke-width:2}.nt{fill:#eff4ff;stroke:#84adff;stroke-width:1.5}.term{fill:#f9fafb;stroke:#98a2b3;stroke-width:1.5}.note{font-size:14px;fill:#526174}</style>
<text x="28" y="36" font-size="21" font-weight="700">One-type balanced-parentheses DPDA</text>
<path class="edge" d="M95,250 L490,250"/>
<path class="edge" d="M525,213 C415,83 685,83 575,213"/>
<rect x="425.0" y="69" width="250" height="48" rx="7" fill="#fff" opacity=".96"/>
<text x="550" y="88" text-anchor="middle" font-size="14">
<tspan x="550" dy="0">read &#x27;(&#x27;</tspan>
<tspan x="550" dy="18">empty stack: push &#x27;(&#x27;</tspan>
</text>
<path class="edge" d="M510,220 C300,110 300,385 510,280"/>
<rect x="80.0" y="194" width="260" height="48" rx="7" fill="#fff" opacity=".96"/>
<text x="210" y="213" text-anchor="middle" font-size="14">
<tspan x="210" dy="0">read &#x27;(&#x27;</tspan>
<tspan x="210" dy="18">top &#x27;(&#x27;: replace by &#x27;((&#x27;</tspan>
</text>
<path class="edge" d="M590,220 C800,110 800,385 590,280"/>
<rect x="795.0" y="194" width="190" height="48" rx="7" fill="#fff" opacity=".96"/>
<text x="890" y="213" text-anchor="middle" font-size="14">
<tspan x="890" dy="0">read &#x27;)&#x27;</tspan>
<tspan x="890" dy="18">top &#x27;(&#x27;: pop</tspan>
</text>
<circle class="state" cx="550" cy="250" r="38"/>
<text x="550" y="250" text-anchor="middle" dominant-baseline="middle" font-size="17">q</text>
<text class="note" x="28" y="425">Accept at end of input exactly when the working stack is empty. A ')' with no '(' on top has no transition.</text>
</svg>
