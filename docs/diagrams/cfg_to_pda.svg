<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 470" role="img" aria-label="One-state nondeterministic PDA that expands grammar variables and matches terminals">
<defs><marker id="arrow" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 z" fill="#344054"/></marker></defs>
<rect width="100%" height="100%" rx="16" fill="#fff"/>
<style>text{font-family:system-ui,Segoe UI,sans-serif;fill:#172b4d}.edge{stroke:#344054;stroke-width:2;fill:none;marker-end:url(#arrow)}.state{fill:#fff;stroke:#344054;stroke-width:2}.nt{fill:#eff4ff;stroke:#84adff;stroke-width:1.5}.term{fill:#f9fafb;stroke:#98a2b3;stroke-width:1.5}.note{font-size:14px;fill:#526174}</style>
<text x="28" y="36" font-size="21" font-weight="700">Standard CFG-to-NPDA construction</text>
<path class="edge" d="M95,245 L490,245"/>
<path class="edge" d="M520,214 C405,60 695,60 580,214"/>
<rect x="405.0" y="53" width="290" height="48" rx="7" fill="#fff" opacity=".96"/>
<text x="550" y="72" text-anchor="middle" font-size="14">
<tspan x="550" dy="0">ε, A → push α</tspan>
<tspan x="550" dy="18">for each production A → α</tspan>
</text>
<path class="edge" d="M510,280 C300,410 300,125 510,220"/>
<rect x="102.5" y="196" width="205" height="48" rx="7" fill="#fff" opacity=".96"/>
<text x="205" y="215" text-anchor="middle" font-size="14">
<tspan x="205" dy="0">a, a → ε</tspan>
<tspan x="205" dy="18">match terminal a</tspan>
</text>
<path class="edge" d="M590,280 C800,410 800,125 590,220"/>
<rect x="780.0" y="196" width="230" height="48" rx="7" fill="#fff" opacity=".96"/>
<text x="895" y="215" text-anchor="middle" font-size="14">
<tspan x="895" dy="0">Nondeterministic</tspan>
<tspan x="895" dy="18">production choice</tspan>
</text>
<circle class="state" cx="550" cy="250" r="38"/>
<text x="550" y="250" text-anchor="middle" dominant-baseline="middle" font-size="17">q</text>
<text class="note" x="28" y="425">Start with grammar start variable on stack. Accept when all input is read and the stack is empty.</text>
</svg>
