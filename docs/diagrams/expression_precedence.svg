<text x="390" y="111" text-anchor="middle" dominant-baseline="middle" font-size="18">+</text>
<rect class="term" x="222.0" y="203" width="56" height="44" rx="10"/>
<text x="250" y="226" text-anchor="middle" dominant-baseline="middle" font-size="18">id</text>
<rect class="nt" x="504.0" y="203" width="52" height="44" rx="10"/>
<text x="530" y="226" text-anchor="middle" dominant-baseline="middle" font-size="18">*</text>
<rect class="term" x="437.0" y="318" width="56" height="44" rx="10"/>
<text x="465" y="341" text-anchor="middle" dominant-baseline="middle" font-size="18">id</text>
